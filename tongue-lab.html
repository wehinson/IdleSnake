<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tongue Lab</title>
    <style>
      :root {
        --page: #232549;
        --card: #2d3060;
        --ink: #f4efd8;
        --muted: #b9b6d8;
        --accent: #e3bd54;
        --screen: #9cac77;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.45 "Courier New", monospace;
      }
      main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: 0.04em; }
      .lede { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
      .controls {
        position: sticky; top: 0; z-index: 2;
        display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
        padding: 10px 12px; margin-bottom: 18px;
        background: #1a1c3a; border: 1px solid #3c3f78; border-radius: 8px;
      }
      .controls label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
      .controls input[type="range"] { width: min(320px, 60vw); accent-color: var(--accent); }
      button, select {
        font: inherit; color: var(--ink); background: #3a3d75;
        border: 1px solid #575ba3; border-radius: 6px; padding: 5px 12px; cursor: pointer;
      }
      button[aria-pressed="true"] { background: var(--accent); color: #1a1c3a; border-color: var(--accent); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
      .card {
        background: var(--card); border: 1px solid #3c3f78; border-radius: 10px;
        padding: 12px; display: flex; flex-direction: column; gap: 8px;
      }
      .card h2 { margin: 0; font-size: 17px; display: flex; gap: 10px; align-items: baseline; }
      .card h2 .num { color: var(--accent); }
      .card p { margin: 0; color: var(--muted); font-size: 13.5px; }
      canvas {
        width: 100%; height: auto; display: block; border-radius: 6px;
        background: var(--screen); image-rendering: pixelated;
      }
      .phase { font-size: 12px; color: var(--accent); min-height: 1.4em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tongue Lab</h1>
      <p class="lede">Tongue designs for eating a Seed, in sets of five. When a Seed is two cells straight ahead, the tongue reaches out, grabs it, and pulls it to the mouth before the head arrives. Display only: the run still eats the Seed when the head enters its cell.</p>
      <div class="controls">
        <label>Set <select id="group"></select></label>
        <button id="play" type="button" aria-pressed="true">Pause</button>
        <label>Speed
          <select id="speed">
            <option value="1">1x (game pace)</option>
            <option value="0.5" selected>0.5x</option>
            <option value="0.25">0.25x</option>
            <option value="0.1">0.1x</option>
          </select>
        </label>
        <label>Timeline <input id="scrub" type="range" min="0" max="1000" value="0"></label>
        <label>Head
          <select id="head">
            <option value="#182413">Forest</option>
            <option value="#267b91">Sky</option>
            <option value="#b3483d">Ruby</option>
            <option value="#b0802d">Gold</option>
          </select>
        </label>
      </div>
      <div class="grid" id="cards"></div>
    </main>
    <script src="engine/tongue.js"></script>
    <script src="tongue-lab.js"></script>
  </body>
</html>
